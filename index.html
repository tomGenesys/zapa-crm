<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zapa CRM Inc</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="toast-region" class="toast-region"></div>

<div class="app-shell">

  <!-- Global Header -->
  <header class="global-header">
    <button class="icon-btn waffle-btn" id="btn-launcher" title="App Launcher" aria-label="App Launcher">
      <svg viewBox="0 0 20 20" width="20" height="20"><g fill="currentColor">
        <rect x="0" y="0" width="4" height="4" rx="1"/><rect x="8" y="0" width="4" height="4" rx="1"/><rect x="16" y="0" width="4" height="4" rx="1"/>
        <rect x="0" y="8" width="4" height="4" rx="1"/><rect x="8" y="8" width="4" height="4" rx="1"/><rect x="16" y="8" width="4" height="4" rx="1"/>
        <rect x="0" y="16" width="4" height="4" rx="1"/><rect x="8" y="16" width="4" height="4" rx="1"/><rect x="16" y="16" width="4" height="4" rx="1"/>
      </g></svg>
    </button>

    <div class="brand">
      <span class="brand-mark">Z</span>
      <span class="brand-name">Zapa CRM<span class="brand-inc"> Inc</span></span>
    </div>

    <div class="app-name-chip">Sales</div>

    <div class="global-search">
      <svg viewBox="0 0 20 20" width="14" height="14"><path fill="currentColor" d="M13.6 12.2h-.7l-.6-.5a5.4 5.4 0 1 0-1.3 1.3l.5.6v.7L16 18.6 17.6 17l-4-4Zm-8.6 0a3.8 3.8 0 1 1 0-7.6 3.8 3.8 0 0 1 0 7.6Z"/></svg>
      <input type="text" id="global-search-input" placeholder="Search Zapa CRM"/>
    </div>

    <div class="header-spacer"></div>

    <button class="icon-btn" id="btn-new" title="Create New">
      <svg viewBox="0 0 20 20" width="18" height="18"><path fill="currentColor" d="M10 2a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H3a1 1 0 1 1 0-2h6V3a1 1 0 0 1 1-1Z"/></svg>
    </button>
    <button class="icon-btn" id="btn-genesys" title="Genesys Cloud">
      <svg viewBox="0 0 20 20" width="18" height="18"><path fill="currentColor" d="M10 2a6 6 0 0 0-6 6v4.5A2.5 2.5 0 0 0 6.5 15H7v-6H5V8a5 5 0 0 1 10 0v1h-2v6h.5a2.5 2.5 0 0 0 2.5-2.5V8a6 6 0 0 0-6-6Z"/><rect x="4" y="10" width="2.6" height="4.4" rx="1" fill="currentColor"/><rect x="13.4" y="10" width="2.6" height="4.4" rx="1" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn" title="Notifications" id="btn-notif">
      <svg viewBox="0 0 20 20" width="18" height="18"><path fill="currentColor" d="M10 1.6c-3 0-5 2.1-5 5v3.3c0 .6-.2 1.2-.6 1.7l-.9 1.2c-.6.8 0 2 1 2h11c1 0 1.6-1.2 1-2l-.9-1.2c-.4-.5-.6-1.1-.6-1.7V6.6c0-2.9-2-5-5-5Z"/><path fill="currentColor" d="M10 20a2.2 2.2 0 0 0 2.2-2H7.8A2.2 2.2 0 0 0 10 20Z"/></svg>
      <span class="notif-dot"></span>
    </button>
    <button class="icon-btn" title="Help">
      <svg viewBox="0 0 20 20" width="18" height="18"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="10" y="14.5" font-size="10" text-anchor="middle" fill="currentColor" font-family="Arial">?</text></svg>
    </button>
    <button class="icon-btn" title="Setup">
      <svg viewBox="0 0 20 20" width="18" height="18"><path fill="currentColor" d="M17 11.4v-2.8l-2.1-.5a5.9 5.9 0 0 0-.6-1.5l1.2-1.8-2-2-1.8 1.2a5.9 5.9 0 0 0-1.5-.6L9.7 1H6.9l-.5 2.2c-.5.1-1 .3-1.5.6L3.1 2.6l-2 2 1.2 1.8c-.3.5-.5 1-.6 1.5L-.3 8.6v2.8l2.2.5c.1.5.3 1 .6 1.5L1.3 15.2l2 2 1.8-1.2c.5.3 1 .5 1.5.6l.5 2.2h2.8l.5-2.2c.5-.1 1-.3 1.5-.6l1.8 1.2 2-2-1.2-1.8c.3-.5.5-1 .6-1.5l2.2-.5ZM10 13.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(1.3,0)"/></svg>
    </button>
    <button class="avatar-btn" id="btn-avatar" title="Thomas Prendergast">
      <span class="avatar-circle">TP</span>
    </button>
  </header>

  <!-- Genesys Cloud popover panel -->
  <div class="genesys-panel" id="genesys-panel">
    <div class="genesys-panel-arrow" id="genesys-panel-arrow"></div>
    <div class="genesys-panel-header">
      <h2>Genesys Cloud</h2>
      <button class="genesys-panel-close" id="genesys-panel-close" title="Close">&times;</button>
    </div>
    <div class="genesys-panel-body" id="genesys-panel-body"></div>
  </div>

  <!-- App Launcher Overlay -->
  <div class="launcher-overlay" id="launcher-overlay">
    <div class="launcher-panel">
      <div class="launcher-search">
        <input type="text" placeholder="Search apps and items..."/>
      </div>
      <h3>All Apps</h3>
      <div class="launcher-grid" id="launcher-grid"></div>
    </div>
  </div>

  <!-- Tab Bar -->
  <nav class="tab-bar" id="tab-bar"></nav>

  <!-- Main content -->
  <main class="main-content" id="main-content"></main>
</div>

<!-- Modal root -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-panel" id="modal-panel"></div>
</div>

<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
